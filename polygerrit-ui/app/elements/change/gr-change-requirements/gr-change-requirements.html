<link rel="import" href="/bower_components/polymer/polymer.html">
<link rel="import" href="/bower_components/paper-dialog/paper-dialog.html">
<link rel="import" href="../../../behaviors/rest-client-behavior/rest-client-behavior.html">
<link rel="import" href="../../../styles/shared-styles.html">
<link rel="import" href="../../shared/gr-button/gr-button.html">
<link rel="import" href="../../shared/gr-icons/gr-icons.html">
<link rel="import" href="../../shared/gr-label/gr-label.html">
<link rel="import" href="../../shared/gr-label-info/gr-label-info.html">
<link rel="import" href="../../shared/gr-limited-text/gr-limited-text.html">

<dom-module id="gr-change-requirements">
  <template strip-whitespace>
    <style include="shared-styles">
      :host {
        display: table;
        width: 100%;
      }
      .status {
        color: #FFA62F;
        display: inline-block;
        text-align: center;
        font-family: var(--monospace-font-family);
        font-size: var(--font-size-mono);
        line-height: var(--line-height-mono);
      }
      .approved.status {
        color: var(--vote-text-color-recommended);
      }
      .rejected.status {
        color: var(--vote-text-color-disliked);
      }
      iron-icon {
        color: inherit;
      }
      .status iron-icon {
        vertical-align: top;
      }
      section {
        display: table-row;
      }
      .show-hide {
        float: right;
      }
      .title {
        min-width: 10em;
        padding: var(--spacing-s) var(--spacing-m) 0 var(--requirements-horizontal-padding);
      }
      .value {
        padding: var(--spacing-s) 0 0 0;
      }
      .title,
      .value {
        display: table-cell;
        vertical-align: top;
      }
      .hidden {
        display: none;
      }
      .showHide {
        cursor: pointer;
      }
      .showHide .title {
        padding-bottom: var(--spacing-m);
        padding-top: var(--spacing-l);
      }
      .showHide .value {
        padding-top: 0;
        vertical-align: middle;
      }
      .showHide iron-icon {
        color: var(--deemphasized-text-color);
        float: right;
      }
      .spacer {
        height: var(--spacing-m);
      }

      /* test section */
      #suggestionDialog h2 {
        padding: var(--spacing-m);
      }
      #suggestionDialog table {
        border-collapse: collapse;
        margin: 0 var(--spacing-l);
      }
      #suggestionDialog table td,
      #suggestionDialog table th {
        border: 1px solid var(--border-color);
        text-align: left;
        padding: var(--spacing-m);
      }
      .pointer {
        cursor: pointer;
      }
    </style>
    <template
        is="dom-repeat"
        items="[[_requirements]]">
      <section>
        <div class="title requirement">
          <span class$="status [[item.style]]">
            <iron-icon class="icon" icon="[[_computeRequirementIcon(item.satisfied)]]"></iron-icon>
          </span>
          <gr-limited-text class="name" limit="40" text="[[item.fallback_text]]"></gr-limited-text>
        </div>
        <div class="value pointer">
          <iron-icon icon="gr-icons:more-horiz" on-click="_openSuggestDialogTwo"></iron-icon>
        </div>
      </section>
    </template>
    <template
        is="dom-repeat"
        items="[[_requiredLabels]]">
      <section>
        <div class="title">
          <span class$="status [[item.style]]">
            <iron-icon class="icon" icon="[[item.icon]]"></iron-icon>
          </span>
          <gr-limited-text class="name" limit="40" text="[[item.label]]"></gr-limited-text>
        </div>
        <div class="value">
          <gr-label-info
              change="{{change}}"
              account="[[account]]"
              mutable="[[mutable]]"
              label="[[item.label]]"
              label-info="[[item.labelInfo]]"></gr-label-info>
        </div>
      </section>
    </template>
    <section class="spacer"></section>
    <section class$="spacer [[_computeShowOptional(_optionalLabels.*)]]"></section>
    <section
        show-bottom-border$="[[_showOptionalLabels]]"
        on-click="_handleShowHide"
        class$="showHide [[_computeShowOptional(_optionalLabels.*)]]">
      <div class="title">Other labels</div>
      <div class="value">
        <iron-icon
            id="showHide"
            icon="[[_computeShowHideIcon(_showOptionalLabels)]]">
        </iron-icon>
      </label>
      </div>
    </section>
    <template
        is="dom-repeat"
        items="[[_optionalLabels]]">
      <section class$="optional [[_computeSectionClass(_showOptionalLabels)]]">
        <div class="title">
          <span class$="status [[item.style]]">
            <template is="dom-if" if="[[item.icon]]">
              <iron-icon class="icon" icon="[[item.icon]]"></iron-icon>
            </template>
            <template is="dom-if" if="[[!item.icon]]">
              <span>[[_computeLabelValue(item.labelInfo.value)]]</span>
            </template>
          </span>
          <gr-limited-text class="name" limit="40" text="[[item.label]]"></gr-limited-text>
        </div>
        <div class="value">
          <gr-label-info
              change="{{change}}"
              account="[[account]]"
              mutable="[[mutable]]"
              label="[[item.label]]"
              label-info="[[item.labelInfo]]"></gr-label-info>
        </div>
      </section>
    </template>
    <section class$="spacer [[_computeShowOptional(_optionalLabels.*)]] [[_computeSectionClass(_showOptionalLabels)]]"></section>
    <paper-dialog id="suggestionDialog" modal>
      <h2>[[_testSuggestionTitle]]</h2>
      <template is="dom-if" if="[[_testOne]]">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Name</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <input type="checkbox" checked />
              </td>
              <td>File 1</td>
              <td>Missing code review approvel</td>
            </tr>
            <template is="dom-if" if="[[_testFetched]]">
              <tr>
                <td colspan="3">
                  Suggested reviewers:
                  <template is="dom-repeat" items="[[_testSuggestionItems]]">
                    <label>
                      <input on-click="_testEnableApply" type="checkbox" /> [[item.name]]
                    </label>
                  </template>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <gr-button link on-click="_testGetSuggestion" disabled$="[[_testFetching]]">
          [[_testSuggestButtonText]]
        </gr-button>
      </template>
      <template is="dom-if" if="[[_testTwo]]">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Name</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <input type="checkbox" checked />
              </td>
              <td>File 1</td>
              <td>Missing code review approvel</td>
            </tr>
            <template is="dom-if" if="[[_testFetched]]">
              <tr>
                <td colspan="3">
                  Suggested reviewers:
                  <template is="dom-repeat" items="[[_testSuggestionItems]]">
                    <label>
                      <input on-click="_testEnableApply" type="checkbox" /> [[item.name]]
                    </label>
                  </template>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <gr-button link on-click="_testGetSuggestion" disabled$="[[_testFetching]]">
          [[_testSuggestButtonText]]
        </gr-button>
      </template>
      <div class="buttons">
        <paper-button dialog-confirm autofocus>Close</paper-button>
        <paper-button dialog-confirm disabled$="[[!_testApplyEnabled]]">Apply</paper-button>
      </div>
    </paper-dialog>
  </template>
  <script src="gr-change-requirements.js"></script>
</dom-module>
