<html>
  <head>
    <title>Gerrit Code Review - Sign In</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        color-scheme: light;

        --background-color-primary: #ffffff;
        --background-color-secondary: #f8f9fa;
        --background-color-tertiary: #f1f3f4;
        --primary-text-color: #000000de;
        --deemphasized-text-color: #5f6368;
        --border-color: #e0e0e0;

        --primary-button-background-color: #1565c0;
        --primary-button-text-color: #ffffff;
        --link-color: #1565c0;

        --error-background: #fce8e6;
        --error-foreground: #c5221f;

        --border-radius: 4px;

        --spacing-s: 4px;
        --spacing-m: 8px;
        --spacing-l: 12px;
        --spacing-xl: 16px;
        --spacing-xxl: 24px;

        --font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
        --header-font-family: "Open Sans", "Roboto", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        --font-size-normal: 14px;
        --font-size-small: 12px;
        --font-size-h1: 22px;
        --font-weight-normal: 400;
        --font-weight-medium: 500;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;

          --background-color-primary: #202124;
          --background-color-secondary: #2d2e31;
          --background-color-tertiary: #3c4043;
          --primary-text-color: #e8eaed;
          --deemphasized-text-color: #9aa0a6;
          --border-color: #5f6368;

          --primary-button-background-color: #90caf9;
          --primary-button-text-color: #000000;
          --link-color: #90caf9;

          --error-background: #3b1f1d;
          --error-foreground: #f28b82;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: var(--background-color-primary);
        color: var(--primary-text-color);
        font-family: var(--font-family);
        font-size: var(--font-size-normal);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.login {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: var(--spacing-xxl) 0;
      }

      #gerrit_topmenu {
        width: 100%;
      }

      #gerrit_header {
        width: 100%;
        max-width: 520px;
        padding: 0 var(--spacing-xxl);
        display: flex;
        justify-content: center;
      }

      #gerrit_header a {
        display: inline-flex;
      }

      #gerrit_body {
        width: 100%;
        max-width: 520px;
        padding: var(--spacing-xxl);
      }

      h1 {
        font-family: var(--header-font-family);
        font-size: var(--font-size-h1);
        line-height: 1.25;
        font-weight: var(--font-weight-medium);
        margin: 0 0 var(--spacing-xxl);
        text-align: center;
        color: var(--primary-text-color);
      }

      #hostName {
        color: var(--link-color);
        font-weight: 600;
        white-space: nowrap;
      }

      #login_form {
        background: var(--background-color-secondary);
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: var(--spacing-xxl);
      }

      #logo_box,
      #logo_img {
        display: none;
      }

      #error_message {
        background-color: var(--error-background);
        color: var(--error-foreground);
        padding: var(--spacing-l) var(--spacing-xl);
        margin: 0 0 var(--spacing-xl);
        border-radius: var(--border-radius);
        font-weight: var(--font-weight-medium);
        font-size: var(--font-size-normal);
      }

      .providers-label {
        color: var(--deemphasized-text-color);
        font-size: var(--font-size-small);
        font-weight: var(--font-weight-medium);
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin: 0 0 var(--spacing-l);
      }

      #providers {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-l);
        margin-bottom: var(--spacing-xxl);
      }

      #providers a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-l);
        min-height: 40px;
        padding: var(--spacing-l) var(--spacing-xxl);
        background: var(--primary-button-background-color);
        color: var(--primary-button-text-color);
        text-decoration: none;
        border-radius: var(--border-radius);
        font-size: var(--font-size-normal);
        font-weight: var(--font-weight-medium);
        text-align: center;
      }

      #providers a + a {
        background: var(--background-color-tertiary);
        color: var(--primary-text-color);
        border: 1px solid var(--border-color);
      }

      #providers a:hover {
        filter: brightness(1.05);
      }

      #providers a:focus-visible {
        outline: 2px solid var(--link-color);
        outline-offset: 2px;
      }

      .cancel-row {
        display: flex;
        justify-content: center;
      }

      #cancel_link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: var(--spacing-m) var(--spacing-xxl);
        margin: 0;
        color: var(--link-color);
        text-decoration: none;
        font-size: var(--font-size-normal);
        font-weight: var(--font-weight-medium);
        border-radius: var(--border-radius);
      }

      #cancel_link:hover {
        background: var(--background-color-tertiary);
      }

      #cancel_link:focus-visible {
        outline: 2px solid var(--link-color);
        outline-offset: 2px;
      }

      @media (max-width: 480px) {
        #gerrit_body {
          padding: var(--spacing-xl);
        }
        #login_form {
          padding: var(--spacing-xl);
        }
      }
    </style>
    <style id="gerrit_sitecss" type="text/css"></style>
  </head>
  <body class="login" id="login_oauth">
    <div id="gerrit_topmenu" class="gerritTopMenu"></div>
    <div id="gerrit_header"></div>
    <div id="gerrit_body" class="gerritBody">
      <h1>
        Sign In to Gerrit Code Review at <span id="hostName">example.com</span>
      </h1>
      <form method="POST" action="#" id="login_form">
        <input type="hidden" name="link" id="f_link" value="1" />
        <div id="logo_box"><div id="logo_img"></div></div>
        <div id="error_message">Invalid OAuth provider.</div>

        <p class="providers-label">Continue with</p>

        <div id="providers"></div>

        <div class="cancel-row">
          <a href="../" id="cancel_link">Cancel</a>
        </div>
      </form>
    </div>
    <div id="gerrit_footer_wrapper">
      <div id="gerrit_footer"></div>
    </div>
  </body>
</html>
