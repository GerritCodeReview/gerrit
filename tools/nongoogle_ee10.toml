# EE10 (jakarta.servlet) flavour dependencies.
#
# These are resolved in the ISOLATED external_deps_ee10 repository, not the
# shared external_deps. Guice 7 is the same Maven GA as the core Guice 6
# (com.google.inject:guice), so it cannot share a resolution with it; Guice 7
# also switches @Inject from javax.inject to jakarta.inject. Keeping the whole
# Guice/inject cluster here lets the EE8/default WAR stay on Guice 6 while the
# EE10 WAR consumes Guice 7.
#
# Same Library-Compliance exemption rationale as nongoogle.toml.

[versions]
guice = "7.0.0"

[libraries]
guice-library = { module = "com.google.inject:guice", version.ref = "guice" }
guice-assistedinject = { module = "com.google.inject.extensions:guice-assistedinject", version.ref = "guice" }
guice-servlet = { module = "com.google.inject.extensions:guice-servlet", version.ref = "guice" }
